  <!-- Pantalla de carga: visible hasta que Flutter pinta su primer cuadro. -->
  <style>
    #sire-carga {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fff; color: #555;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px;
    }
    #sire-carga svg { width: 72px; height: 72px; }
    #sire-carga .giro {
      width: 28px; height: 28px; margin: 20px 0 12px;
      border: 3px solid rgba(198, 40, 40, .2); border-top-color: #C62828; border-radius: 50%;
      animation: sire-giro 1s linear infinite;
    }
    @keyframes sire-giro { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      #sire-carga { background: #121212; color: #bbb; }
    }
  </style>

    <div class="giro"></div>
    <div>Cargando SIRE…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('sire-carga');
      if (carga) carga.remove();
    });
  </script>
